<div id="panzo-direction" aria-label="Panzo 录制器与编辑器布局方案">
  <div class="pz-review" aria-label="查看界面">
    <button type="button" data-page="editor" aria-pressed="true">编辑器</button>
    <button type="button" data-page="recorder" aria-pressed="false">录制器</button>
  </div>
  <section class="pz-window" aria-label="Panzo 界面方案">
    <div class="pz-editor">
      <header class="pz-top">
        <button class="pz-icon" type="button" data-go-record aria-label="返回录制器"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
        <div class="pz-name"><strong>产品演示</strong><span class="pz-saved" aria-live="polite">已保存</span></div>
        <div class="pz-history"><button type="button" class="pz-icon" aria-label="撤销" disabled><i data-lucide="undo-2" aria-hidden="true"></i></button><button type="button" class="pz-icon" aria-label="重做" disabled><i data-lucide="redo-2" aria-hidden="true"></i></button></div>
        <div class="pz-top-actions"><button type="button" data-save disabled><i data-lucide="save" aria-hidden="true"></i><span>保存</span></button><button type="button" class="pz-primary" data-export><i data-lucide="upload" aria-hidden="true"></i>导出视频</button></div>
      </header>
      <div class="pz-workspace">
        <main class="pz-center">
          <div class="pz-stage">
            <div class="pz-video">
              <div class="pz-recorded-page"><div class="pz-page-top"><span>Panzo</span><span>产品介绍</span></div><div class="pz-page-copy"><span>从录制到表达</span><strong>把每一步，讲清楚。</strong><p>一段清晰的演示，从这里开始。</p><div class="pz-demo-lines"><b></b><b></b><b></b></div></div><i class="pz-video-cursor" data-lucide="mouse-pointer-2" aria-hidden="true"></i></div>
            </div>
          </div>
          <div class="pz-transport">
            <div class="pz-player"><button type="button" class="pz-icon" data-home aria-label="回到开头"><i data-lucide="skip-back" aria-hidden="true"></i></button><button type="button" class="pz-icon pz-play" data-play aria-label="播放"><i data-lucide="play" aria-hidden="true"></i></button><span class="pz-time"><span data-time>00:08.000</span><span> / 00:32.000</span></span></div>
            <button type="button" class="pz-subtle" data-inspector aria-expanded="true"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>属性</button>
          </div>
        </main>
        <aside class="pz-inspector" aria-label="画布属性">
          <div class="pz-panel-title"><strong>画布</strong><span>整个视频</span></div>
          <div class="pz-property"><span>背景</span><div class="pz-swatches" aria-label="背景颜色"><button type="button" data-color="#c5d5e7" aria-label="雾蓝" aria-pressed="true" style="--swatch:#c5d5e7"></button><button type="button" data-color="#e9d6c5" aria-label="暖杏" aria-pressed="false" style="--swatch:#e9d6c5"></button><button type="button" data-color="#d8d1ef" aria-label="淡紫" aria-pressed="false" style="--swatch:#d8d1ef"></button><button type="button" data-color="#ccdace" aria-label="鼠尾草" aria-pressed="false" style="--swatch:#ccdace"></button><button type="button" data-color="#383a46" aria-label="石墨" aria-pressed="false" style="--swatch:#383a46"></button></div></div>
          <label class="pz-property"><span>边距 <output data-padding-output>8%</output></span><input data-padding type="range" min="0" max="25" value="8" aria-label="画布边距"></label>
          <label class="pz-property"><span>圆角 <output data-radius-output>12 px</output></span><input data-radius type="range" min="0" max="108" value="12" aria-label="画面圆角"></label>
          <label class="pz-property"><span>阴影 <output data-shadow-output>30%</output></span><input data-shadow type="range" min="0" max="100" value="30" aria-label="画面阴影"></label>
          <label class="pz-cursor-toggle"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i><span>显示光标</span><input type="checkbox" data-cursor checked></label>
        </aside>
      </div>
      <section class="pz-timeline" aria-label="视频时间线">
        <div class="pz-timeline-tools"><div><button type="button" data-split><i data-lucide="scissors" aria-hidden="true"></i>分割</button><button type="button" class="pz-subtle" data-camera><i data-lucide="plus" aria-hidden="true"></i>添加镜头</button></div><span data-selection>视频 · 32 秒</span></div>
        <div class="pz-ruler"><span></span><div><span>00:00</span><span>00:08</span><span>00:16</span><span>00:24</span><span>00:32</span></div></div>
        <div class="pz-track"><span>视频</span><div class="pz-video-track"><div class="pz-clip-label">产品演示</div><div class="pz-thumbs" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div><div class="pz-split" hidden></div><div class="pz-head" aria-hidden="true"></div></div></div>
        <div class="pz-track"><span>镜头</span><div class="pz-camera-track"><button type="button" class="pz-camera-clip" data-camera-select><i data-lucide="focus" aria-hidden="true"></i>1.5×</button></div></div>
        <label class="pz-seek"><span>播放位置</span><input type="range" min="0" max="32" step="0.001" value="8" data-seek aria-label="播放位置，秒"></label>
        <div class="pz-context" data-context hidden><span>镜头</span><label>倍率 <input type="number" min="1" max="8" step="0.1" value="1.5" data-zoom></label><button type="button" class="pz-subtle" data-camera-deselect>完成</button></div>
      </section>
    </div>
    <div class="pz-recorder" hidden>
      <header class="pz-rec-top"><strong>Panzo</strong><button type="button" data-open><i data-lucide="folder-open" aria-hidden="true"></i>打开工程</button></header>
      <main class="pz-record-main"><div class="pz-record-heading"><strong>新录制</strong><span>选择要录制的内容</span></div><div class="pz-source-tabs"><button type="button" data-source="monitor" aria-pressed="true"><i data-lucide="monitor" aria-hidden="true"></i>整个屏幕</button><button type="button" data-source="window" aria-pressed="false"><i data-lucide="app-window" aria-hidden="true"></i>应用窗口</button></div><div class="pz-source-card"><i data-lucide="monitor" aria-hidden="true"></i><div><strong data-source-name>主显示器</strong><span>2560 × 1440 · 60 fps</span></div><i data-lucide="check" aria-hidden="true"></i></div><div class="pz-audio"><i data-lucide="volume-x" aria-hidden="true"></i>不录制声音</div><button type="button" class="pz-primary pz-record-button" data-record><i data-lucide="circle" aria-hidden="true"></i><span>开始录制</span></button><button type="button" class="pz-recent" data-open><i data-lucide="file-video" aria-hidden="true"></i><span><strong>继续编辑</strong><small>产品演示</small></span><i data-lucide="arrow-right" aria-hidden="true"></i></button></main>
    </div>
    <div class="pz-export" hidden aria-label="导出设置"><div class="pz-export-title"><strong>导出视频</strong><button type="button" class="pz-icon" data-close-export aria-label="关闭导出设置"><i data-lucide="x" aria-hidden="true"></i></button></div><label>分辨率<select><option>原始尺寸 · 2560 × 1440</option><option>1080p</option></select></label><div class="pz-export-meta">MP4 · 60 fps</div><button type="button" class="pz-primary" data-close-export>返回编辑</button></div>
  </section>
</div>

<script>
(() => {
  const root=document.getElementById('panzo-direction');
  const $=s=>root.querySelector(s);
  const state={page:'editor',compact:true,recording:false,time:8,inspector:true};
  let timer=null;
  const timeText=v=>`00:${Math.floor(v).toString().padStart(2,'0')}.${Math.floor(v%1*1000).toString().padStart(3,'0')}`;
  function render(){
    $('.pz-editor').hidden=state.page!=='editor';$('.pz-recorder').hidden=state.page!=='recorder';
    root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));
    root.style.setProperty('--pz-control',state.compact?'34px':'38px');
    $('[data-time]').textContent=timeText(state.time);$('[data-seek]').value=state.time;$('.pz-head').style.left=`${state.time/32*100}%`;
    $('.pz-inspector').hidden=!state.inspector;$('[data-inspector]').setAttribute('aria-expanded',String(state.inspector));
    $('.pz-workspace').style.gridTemplateColumns=state.inspector?'':'minmax(0,1fr)';
    $('[data-record]').dataset.active=state.recording;$('[data-record] span').textContent=state.recording?'停止录制':'开始录制';
    $('.pz-record-heading strong').textContent=state.recording?'正在录制':'新录制';
    $('.pz-record-heading span').textContent=state.recording?'完成后进入编辑器':'选择要录制的内容';
    root.querySelectorAll('[data-source]').forEach(b=>b.disabled=state.recording);
  }
  function stop(){if(timer){clearInterval(timer);timer=null;}$('[data-play]').setAttribute('aria-label','播放');$('[data-play]').innerHTML='<i data-lucide="play" aria-hidden="true"></i>';if(globalThis.lucide)lucide.createIcons();}
  function page(value){stop();state.page=value;$('.pz-export').hidden=true;render();}
  function dirty(){$('.pz-saved').textContent='未保存';$('[data-save]').disabled=false;}
  root.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>page(b.dataset.page)));
  $('[data-go-record]').addEventListener('click',()=>page('recorder'));
  root.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>page('editor')));
  $('[data-seek]').addEventListener('input',e=>{stop();state.time=Number(e.target.value);render();});
  $('[data-home]').addEventListener('click',()=>{state.time=0;render();});
  $('[data-play]').addEventListener('click',()=>{if(timer){stop();return;}if(state.time>=32)state.time=0;$('[data-play]').setAttribute('aria-label','暂停');$('[data-play]').innerHTML='<i data-lucide="pause" aria-hidden="true"></i>';if(globalThis.lucide)lucide.createIcons();timer=setInterval(()=>{state.time=Math.min(32,state.time+.1);render();if(state.time>=32)stop();},100);});
  $('[data-inspector]').addEventListener('click',()=>{state.inspector=!state.inspector;render();});
  $('[data-save]').addEventListener('click',()=>{$('.pz-saved').textContent='已保存';$('[data-save]').disabled=true;});
  root.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{$('.pz-video').style.background=b.dataset.color;root.querySelectorAll('[data-color]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));dirty();}));
  for(const name of ['padding','radius','shadow'])$(`[data-${name}]`).addEventListener('input',e=>{const v=Number(e.target.value);$(`[data-${name}-output]`).textContent=v+(name==='radius'?' px':'%');if(name==='padding')$('.pz-video').style.padding=v+'%';if(name==='radius')$('.pz-recorded-page').style.borderRadius=v+'px';if(name==='shadow')$('.pz-recorded-page').style.boxShadow=`0 8px 20px rgba(0,0,0,${v/100*.65})`;dirty();});
  $('[data-cursor]').addEventListener('change',e=>{$('.pz-video-cursor').style.visibility=e.target.checked?'visible':'hidden';dirty();});
  $('[data-split]').addEventListener('click',()=>{if(state.time<=0||state.time>=32)return;$('.pz-split').hidden=false;$('.pz-split').style.left=state.time/32*100+'%';$('[data-selection]').textContent='2 个视频片段';dirty();});
  const selectCamera=()=>{$('[data-context]').hidden=false;$('[data-selection]').textContent='已选择镜头';};
  $('[data-camera]').addEventListener('click',()=>{selectCamera();dirty();});$('[data-camera-select]').addEventListener('click',selectCamera);
  $('[data-camera-deselect]').addEventListener('click',()=>{$('[data-context]').hidden=true;$('[data-selection]').textContent='视频 · 32 秒';});
  $('[data-zoom]').addEventListener('input',e=>{if(!e.target.validity.valid)return;$('.pz-camera-clip').textContent=Number(e.target.value).toFixed(1)+'×';dirty();});
  $('[data-record]').addEventListener('click',()=>{if(state.recording){state.recording=false;page('editor');}else{state.recording=true;render();}});
  root.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>{root.querySelectorAll('[data-source]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));$('[data-source-name]').textContent=b.dataset.source==='monitor'?'主显示器':'产品演示窗口';}));
  $('[data-export]').addEventListener('click',()=>{stop();$('.pz-export').hidden=false;});
  root.querySelectorAll('[data-close-export]').forEach(b=>b.addEventListener('click',()=>{$('.pz-export').hidden=true;}));
  root.addEventListener('keydown',e=>{if(e.key==='Escape')$('.pz-export').hidden=true;});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'compact',{label:'紧凑工具栏'});tweak.addToggle(state,'inspector',{label:'展开属性栏'});}
})();
</script>
